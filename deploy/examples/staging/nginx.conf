# Staging: serve the built SPA and proxy the Supabase API paths to the local CLI stack's gateway,
# so the browser sees one origin (decision D2). Production uses the same paths, routed by the proxy.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Security headers (docs/SECURITY.md). connect-src 'self' works because the API is same-origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
  add_header X-Robots-Tag "noindex, nofollow" always;  # staging must never be indexed
  # Hashed assets are cached forever; everything else is revalidated, so deploys show up at once.
  # Set here via a map, not per location: an add_header inside a location drops every header above.
  add_header Cache-Control $cache_control always;

  # Only these API prefixes are forwarded. Never "/" (Studio) or "/pg" (meta).
  # Share links: link previews (Open Graph HTML) and the card image, from the `share` function.
  location /s/ {
    resolver 127.0.0.11 valid=10s;
    set $gateway http://SUPABASE_GATEWAY:8000;
    rewrite ^/s/(.*)$ /functions/v1/share/$1 break;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }
  location ~ ^/(auth|rest|storage|realtime|functions)/v1/ {
    # Resolve at request time so nginx starts even while the dev stack is stopped.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://SUPABASE_GATEWAY:8000;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;     # realtime websockets
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
  }

  # nginx's MIME list has no .webmanifest; browsers expect application/manifest+json (PWA install).
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }
  location /assets/ {
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;
  }
}

map $uri $cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
