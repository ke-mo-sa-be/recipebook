name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change what runs.
jobs:
  web:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm tokens:check
      - run: pnpm build
      - name: No server secrets in the frontend or committed files
        run: node scripts/check-no-secrets.mjs
      - name: Dependency audit (production deps, high+)
        run: pnpm audit --prod --audit-level high

  functions:
    name: Edge Functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: deno check every function
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            echo "::group::$name"
            deno check --config "$dir/deno.json" "$dir/index.ts"
            echo "::endgroup::"
          done

  database:
    name: Migrations, RLS tests, schema lint
    runs-on: ubuntu-latest
    env:
      SITE_URL: http://localhost:5173
      AUTH_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      SMTP_ENABLED: 'false'
      SMTP_PORT: '587'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Start database, auth and storage
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta,edge-runtime,realtime,mailpit
      - run: supabase test db
      - run: supabase db lint --level warning --fail-on warning
