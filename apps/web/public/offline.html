<!doctype html>
<html lang="ml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paachakam · ഓഫ്‌ലൈൻ</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f1ef;
        --text: #151413;
        --muted: #6b6862;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f0e;
          --text: #f2f1ef;
          --muted: #a8a49e;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        text-align: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Sans Malayalam',
          sans-serif;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 20px 0 8px;
      }
      p {
        color: var(--muted);
        margin: 4px 0;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 14px 28px;
        border-radius: 999px;
        background: var(--text);
        color: var(--bg);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>ഇന്റർനെറ്റ് ഇല്ല</h1>
      <p>കണക്ഷൻ തിരിച്ചു വരുമ്പോൾ പാചകം വീണ്ടും തുറക്കൂ.</p>
      <p lang="en">You're offline. Paachakam will be back when your connection is.</p>
      <a href="/">വീണ്ടും ശ്രമിക്കുക · Try again</a>
    </main>
  </body>
</html>
